//==========================================================================
//リポジトリ設定
//==========================================================================


//プラグインの依存関係を解決するリポジトリ
pluginManagement {
    
    //Architecturyプラグインの取得先
    apply([
        from: "build-logic/architectury_setting/part/plugin_repo_settings.gradle",
        to: settings
    ])

    repositories {
        
        google()
        mavenCentral()
        mavenLocal()

        //一部が jcenter に依存
        gradlePluginPortal()
    }

    includeBuild("build-logic")
}


plugins {
    // foojay-resolverプラグインを適用してJDKの自動ダウンロードを許可する
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}


//全プロジェクトで使用するリポジトリを指定
dependencyResolutionManagement {
    repositories {
        
        google()
        mavenCentral()
        mavenLocal()
    }

    //ArchitecturyとLoomによるプロジェクト側のリポジトリ登録を許可する
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)

    //カタログファイルを自動検出してマッピング
    //libs.versions.tomlはデフォルトで読み込まれるので除外。
    versionCatalogs {
        file("gradle").listFiles()?.sort { it.name }?.each { catalogFile ->
            if(!catalogFile.isFile()) return;
            if(!catalogFile.name.endsWith(".versions.toml")) return;
            if(catalogFile.name == "libs.versions.toml") return;
            def catalogName = catalogFile.name - ".versions.toml"
            create(catalogName + "Libs") {
                from(files(catalogFile))
            }
        }
    }
}



//==========================================================================
//プロジェクト設定
//==========================================================================


rootProject.name = "ArchitecturySample"
include("common", "fabric", "neoforge", "quilt")
