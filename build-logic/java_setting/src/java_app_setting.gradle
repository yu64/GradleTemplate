plugins {
  id("java_setting")
  id("application")
}

//==========================================================================
//Javaアプリケーションの設定
//==========================================================================

application {
  // 利用側のapplication.mainClassで上書き可能
  mainClass.convention("app.Main")
}

tasks.named("jar", Jar) {
  manifest {
    // Providerを渡し、利用側で上書きしたエントリーポイントも反映する
    attributes "Main-Class": application.mainClass
  }
}

