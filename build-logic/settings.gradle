
//==========================================================================
//リポジトリの設定
//==========================================================================


//プラグインの依存関係を解決するリポジトリ
pluginManagement {
  repositories {
      
    google()
    mavenCentral()

    //一部が jcenter に依存
    gradlePluginPortal()
  }

}


//このbuild-logicの前提となるプラグインの依存関係を解決するリポジトリ
//前提となるプラグイン -> 普通の依存関係
dependencyResolutionManagement {

  //repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories {

    google()
    mavenCentral()

    //一部が jcenter に依存
    gradlePluginPortal()

  }

  //親プロジェクトのカタログを検出し、libs以外はファイル名 + Libsで登録する
  versionCatalogs {
    file("../gradle").listFiles()?.sort { it.name }?.each { catalogFile ->
      if(!catalogFile.isFile()) return;
      if(!catalogFile.name.endsWith(".versions.toml")) return;
      def catalogName = catalogFile.name - ".versions.toml"
      create(catalogName == "libs" ? "libs" : catalogName + "Libs") {
        from(files(catalogFile))
      }
    }
  }
}



//==========================================================================
//プロジェクトの設定
//==========================================================================


rootProject.name = "build-logic"


// build-logic 配下の全サブプロジェクトを自動検出
file(".").listFiles()?.each { dir ->
  if(!dir.isDirectory()) return;
  if(dir.name.startsWith(".")) return;
  if(!new File(dir, "build.gradle").exists()) return;
  include(dir.name)
}
